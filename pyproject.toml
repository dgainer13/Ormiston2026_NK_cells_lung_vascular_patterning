[project]
name = "tgfbr2-nk-lung"
version = "0.1.0"
description = "Single-cell analysis: Tgfbr2 in NK cells during lung development"
requires-python = ">=3.12,<3.13"
dependencies = [

    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scikit-misc",          
    "numba",
    "h5py",

    "scanpy>=1.10",
    "anndata>=0.10",
    "leidenalg",
    "igraph",               
    "harmonypy",            

    "jupyterlab",
    "ipywidgets",
    # --- R bridge (built against the system Rig R via R_HOME at install time) ---
    "rpy2",
    "anndata2ri",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
